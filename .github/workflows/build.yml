name: Build ForcePad

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build iOS dylib
        run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"

          xcrun --sdk iphoneos clang \
          -arch arm64 \
          -miphoneos-version-min=15.0 \
          -isysroot "$SDK" \
          -dynamiclib \
          ForcePad.m \
          -install_name @rpath/ExitTest.dylib \
          -o ExitTest.dylib

          file ForcePad.dylib
          xcrun vtool -show-build ForcePad.dylib || true

          - name: Upload ExitTest
          uses: actions/upload-artifact@v4
          with:
            name: ExitTest
            path: ExitTest.dylib

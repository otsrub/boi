name: Build Signed Logic Crash Test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build iOS dylib
        run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"

          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -miphoneos-version-min=15.0 \
            -isysroot "$SDK" \
            -dynamiclib \
            ForcePad.m \
            -install_name @rpath/LOGIC_CRASH_TEST.dylib \
            -o LOGIC_CRASH_TEST.dylib

      - name: Ad-hoc sign dylib
        run: |
          codesign \
            --force \
            --sign - \
            --timestamp=none \
            LOGIC_CRASH_TEST.dylib

      - name: Verify signature
        run: |
          echo "=== FILE ==="
          file LOGIC_CRASH_TEST.dylib

          echo "=== CODE SIGNATURE ==="
          codesign -dvvv LOGIC_CRASH_TEST.dylib

          echo "=== VERIFY ==="
          codesign --verify --verbose=4 LOGIC_CRASH_TEST.dylib

          echo "=== TEST MARKER ==="
          strings LOGIC_CRASH_TEST.dylib | grep LOGIC_CRASH_TEST_20260917

      - name: Upload signed dylib
        uses: actions/upload-artifact@v4
        with:
          name: LOGIC_CRASH_TEST_SIGNED
          path: LOGIC_CRASH_TEST.dylib

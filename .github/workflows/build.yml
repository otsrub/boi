name: Build Logic Crash Test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build crash-test dylib
        run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"

          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -miphoneos-version-min=15.0 \
            -isysroot "$SDK" \
            -dynamiclib \
            ForcePad.m \
            -install_name @rpath/LOGIC_CRASH_TEST.dylib \
            -o LOGIC_CRASH_TEST.dylib

      - name: Verify build
        run: |
          file LOGIC_CRASH_TEST.dylib
          strings LOGIC_CRASH_TEST.dylib | grep LOGIC_CRASH_TEST_20260917

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: LOGIC_CRASH_TEST
          path: LOGIC_CRASH_TEST.dylib
